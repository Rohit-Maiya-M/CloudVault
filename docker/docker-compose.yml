services:
  postgres:
    image: postgres:17
    container_name: cloudvault-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: cloudvault
      POSTGRES_USER: cloudvault
      POSTGRES_PASSWORD: cloudvault_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: